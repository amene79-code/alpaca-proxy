# .github/workflows/rsi2-live-agent.yml
#
# Runs the RSI(2) live cost-measurement agent once per trading day, in the cloud.
#
# TRIGGERING — by EXTERNAL scheduler, not GitHub's own cron.
#   GitHub's `schedule:` is best-effort and, during peak load (US-market
#   afternoon IS peak), delays jobs by HOURS — ours fired ~6h late, overnight,
#   after the US close, so the agent no-op'd every day. `workflow_dispatch`
#   (API/manual) runs IMMEDIATELY, with no such delay. So an external scheduler
#   (cron-job.org / Google Cloud Scheduler) calls the GitHub dispatch API at
#   15:30 ET each weekday and the workflow runs on time. The script's own
#   "within 45 min of close" + "once-per-day" guards still apply.
#
# STATE PERSISTENCE:
#   Actions runners are wiped after every run, so the job commits its two output
#   files (state/rsi2_live_state.json, state/rsi2_live_fills.csv) back to the repo.

name: RSI2 Live Cost Agent

on:
  workflow_dispatch: {}        # triggered on time by an external scheduler via the GitHub API
                               # (schedule: removed — GitHub delayed it past the close every day)

permissions:
  contents: write              # needed so the run can commit state + fills back

concurrency:
  group: rsi2-live             # never let two runs overlap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (restores prior state + fills log)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}   # reuse the Pro Agent's PAT so the commit-back push works

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install alpaca-py pandas numpy

      - name: Run the agent
        env:
          # NEW paper account's keys — distinct secret names (matching your
          # ALPACA_KEY / ALPACA_SECRET house style) so this never clobbers the
          # Pro Agent's existing secrets. The script reads ALPACA_API_KEY /
          # ALPACA_SECRET_KEY from the environment; only the SOURCE secret differs.
          ALPACA_API_KEY:    ${{ secrets.RSI2_ALPACA_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.RSI2_ALPACA_SECRET }}
          # LIVE on PAPER (RSI2_DRY_RUN "false"). Set to "true" to pause into a
          # dry run (no orders) without deleting anything.
          RSI2_DRY_RUN: "false"
        run: python rsi2_live_agent.py

      - name: Commit state + fills back to the repo
        if: ${{ always() }}
        run: |
          git config user.name  "rsi2-agent"
          git config user.email "actions@users.noreply.github.com"
          git add state/rsi2_live_state.json state/rsi2_live_fills.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state/fills change this run (dry run or no-op) — nothing to commit."
          else
            git commit -m "agent run $(date -u +%FT%TZ)"
            git push
          fi
